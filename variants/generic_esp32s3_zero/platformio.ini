[Generic_ESP32S3_Zero]
extends = esp32_base
board = esp32-s3-zero
build_flags =
  ${esp32_base.build_flags}
  -I variants/generic_esp32s3_zero

  ; === LORA PIN ===
  -D P_LORA_DIO_1=13
  -D P_LORA_NSS=7
  -D P_LORA_SCLK=8
  -D P_LORA_MOSI=9
  -D P_LORA_MISO=10
  -D P_LORA_RESET=11
  -D P_LORA_BUSY=12

  ; === Config SX126X ===
  -D SX126X_DIO2_AS_RF_SWITCH=false
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=17 ; M30 modules: 17, M33 modules: 8
  -D SX126X_TXEN=3
  -D SX126X_RXEN=4

  ; === OLED/SENSOR PIN ===
  -D PIN_BOARD_SDA=6
  -D PIN_BOARD_SCL=5

  ; === USER PIN and CONFIG ===
  -D PIN_USER_BTN=0 ; S3Z button key
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/generic_esp32s3_zero>
lib_deps =
  ${esp32_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13

; LORA_FREQ, LORA_BW, LORA_SF and LORA_CR are inherited from [arduino_base].
[env:Generic_ESP32S3_Zero_SX1262_repeater]
extends = Generic_ESP32S3_Zero
build_flags =
  ${Generic_ESP32S3_Zero.build_flags}
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D ADVERT_NAME='"S3Zero Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Generic_ESP32S3_Zero.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${Generic_ESP32S3_Zero.lib_deps}
  ${esp32_ota.lib_deps}

[env:Generic_ESP32S3_Zero_SX1268_repeater]
extends = Generic_ESP32S3_Zero
build_flags =
  ${Generic_ESP32S3_Zero.build_flags}
  -D USE_SX1268
  -D RADIO_CLASS=CustomSX1268
  -D WRAPPER_CLASS=CustomSX1268Wrapper
  -D LORA_FREQ=433.0
  -D LORA_CR=5
  -D ADVERT_NAME='"S3Zero 433 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Generic_ESP32S3_Zero.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${Generic_ESP32S3_Zero.lib_deps}
  ${esp32_ota.lib_deps}
